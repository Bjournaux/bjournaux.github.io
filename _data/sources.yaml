# =====================================================================
#  LAB PUBLICATIONS
# =====================================================================
#  How to add a paper (newest at the top of its section):
#
#    - id: doi:10.1038/s41586-025-09818-x        <- the paper's DOI
#      link: https://www.nature.com/articles/...  <- optional: where the title links to
#      type: paper                               <- paper, preprint or book
#
#  Title, authors, journal and date are filled in automatically from the DOI
#  when the site is rebuilt on GitHub (or by running the "cite" step locally).
#  Any field you write here (title, link, date...) overrides the automatic one.
#
#  Entries WITHOUT an id (e.g. a manuscript under review) are shown exactly
#  as written: give them title, authors, publisher, date and type.
#
#  Optional extras:
#    group: featured        -> also shown on the homepage ("Featured papers")
#    image: images/...jpg   -> thumbnail for featured papers
#    buttons:               -> extra links under the citation (press, data, code)
#      - type: external
#        text: New Scientist
#        link: https://...
# =====================================================================

