# =====================================================================
#  GALLERY PHOTOS, in display order.
#  To add a photo: put the file in images/gallery/<group>/ and add an entry:
#
#    - group: lab                      <- lab, space or field (see groups)
#      image: images/gallery/lab/my-photo.jpg
#      caption: "What the photo shows (place, date)"
#      ratio: 1.5                       <- width / height (optional, avoids
#                                          the layout jumping while loading)
# =====================================================================

